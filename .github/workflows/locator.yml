name: locator
on:
  push:
    paths: ['src/locator/**', 'contracts/**', 'database/**', 'docker-compose.yml', '.dockerignore', '.gitattributes', 'scripts/deploy_*.sh', 'scripts/tests/test_deploy_*.sh', 'scripts/tests/package*.json', 'scripts/tests/test_*workflow.mjs', '.github/workflows/locator.yml', '.github/actions/**']
  pull_request:
    paths: ['src/locator/**', 'contracts/**', 'database/**', 'docker-compose.yml', '.dockerignore', '.gitattributes', 'scripts/deploy_*.sh', 'scripts/tests/test_deploy_*.sh', 'scripts/tests/package*.json', 'scripts/tests/test_*workflow.mjs', '.github/workflows/locator.yml', '.github/actions/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/locator
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: pip install shellcheck-py==0.11.0.1
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test workflow gates and notification results
        working-directory: scripts/tests
        run: npm ci && npm test
      - name: Check deployment scripts
        working-directory: .
        run: |
          bash -n scripts/deploy_*.sh scripts/tests/test_deploy_chaos.sh
          shellcheck scripts/deploy_*.sh scripts/tests/test_deploy_chaos.sh
          bash scripts/tests/test_deploy_chaos.sh locator
      - name: Check workflow
        working-directory: .
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -shellcheck= -pyflakes= .github/workflows/locator.yml
      - name: Build locator image
        working-directory: .
        run: docker compose build locator

  deploy:
    needs: [test]
    if: needs.test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: locator
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Deploy this checkout to EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy_service.sh locator

  notify:
    needs: [test, deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          service: locator
          stage: 테스트·배포
          result: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || (needs.test.result == 'success' && needs.deploy.result == 'success') && 'success' || 'failure' }}
